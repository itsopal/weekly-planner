name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint (Python 3.11 / Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web_planner/requirements-dev.lock

      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r web_planner/requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check web_planner/static/app.js
          node --check web_planner/static/service-worker.js

      - name: Lint
        run: python -m ruff check web_planner tests

      - name: Check formatting
        run: python -m ruff format --check web_planner tests

      - name: Run tests
        run: python -m pytest

      - name: Verify pre-commit hooks
        run: python -m pre_commit run --all-files
